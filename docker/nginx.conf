worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Account API. The resolver lets Nginx start (and keep serving the game) while the
        # api container is down or restarting; requests then fail with 502 until it is back.
        location /api/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_upstream http://api:3000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # Overwrite, never append, so a client cannot forge the address used for throttling.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 20s;
            # The API sets its own nosniff header; Nginx adds one for every response.
            proxy_hide_header X-Content-Type-Options;
            client_max_body_size 32k;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
    }
}
